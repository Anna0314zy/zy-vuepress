/**
 * 数组扁平化 - 可控制深度
 * @param {Array} arr 要扁平化的数组
 * @param {number} depth 扁平化深度，默认 1
 * @returns {Array} 扁平化后的数组
 */
function flattenArray(arr, depth = 1) {
  // 入参校验
  if (!Array.isArray(arr)) {
    return [];
  }

  const result = [];

  for (const item of arr) {
    // 如果是数组 且 还能继续扁平化
    if (Array.isArray(item) && depth > 0) {
      result.push(...flattenArray(item, depth - 1));
    } else {
      result.push(item);
    }
  }

  return result;
}

function getTreeDepth(root) {
  if (!root) return 0;
  let queue = [root];
  let depth = 0;

  while (queue.length) {
    let size = queue.length;
    depth++;
    for (let i = 0; i < size; i++) {
      let node = queue.shift();
      if (node.left) queue.push(node.left);
      if (node.right) queue.push(node.right);
    }
  }
  return depth;
}

function findTreeNode(treeList, targetId) {
  // 遍历当前层级
  for (const item of treeList) {
    if (item.id === targetId) {
      return item; // 找到直接返回
    }
    // 有子节点递归查找
    if (item.children && item.children.length) {
      const res = findTreeNode(item.children, targetId);
      if (res) return res;
    }
  }
  // 没找到
  return null;
}

function findNodePath(treeList, targetId, path = []) {
  for (const item of treeList) {
    const currPath = [...path, item.id];
    if (item.id === targetId) return currPath;
    if (item.children?.length) {
      const res = findNodePath(item.children, targetId, currPath);
      if (res) return res;
    }
  }
  return null;
}
function findNodeBFS(treeList, targetId) {
  // 空值保护
  if (!Array.isArray(treeList) || treeList.length === 0) return null;

  // 队列（标准 BFS 结构，不使用 shift()）
  const queue = [...treeList];

  while (queue.length > 0) {
    // 改用 pop() 从尾部取，O(1) 性能！
    const node = queue.pop();

    // 节点为空直接跳过
    if (!node) continue;

    // 找到目标
    if (node.id === targetId) return node;

    // children 安全判断 + 入队
    if (Array.isArray(node.children) && node.children.length > 0) {
      queue.push(...node.children);
    }
  }

  return null;
}

function compose(...funcs) {
  if (funcs.length === 0) {
    return arg => arg
  }

  if (funcs.length === 1) {
    return funcs[0]
  }

  return funcs.reduce(
    (a, b) =>
      (...args) =>
        a(b(...args))
  )
}

function buildTree(data) {
  // 1. 创建一个 id -> 对应对象的映射
  const treeMap = data.reduce((map, item) => {
    map[item.id] = { ...item, children: [] }; // 初始化每个节点的 children 数组
    return map;
  }, {});

  console.log('treeMap', treeMap);

  const result = [];

  // 2. 根据父子关系建立树形结构
  data.forEach(item => {
    if (item.pid === 0) {
      // 如果没有父级，直接作为根节点
      result.push(treeMap[item.id]);
    } else {
      // 否则将当前节点添加到父节点的 children 中
      if (treeMap[item.pid]) {
        treeMap[item.pid].children.push(treeMap[item.id]);
      }
    }
  });

  return result;
}

function treeToFlatIter(tree) {
  const res = []
  const queue = [...tree]

  let index = 0

  while (index < queue.length) {
    const node = queue[index++]

    const { children, ...item } = node

    res.push(item)

    if (children?.length) {
      queue.push(...children)
    }
  }

  return res
}
// 遍历
function treeToFlat(tree) {
  let res = []
  tree.forEach(item => {
    const { children, ...rest } = item
    res.push(rest)
    if (children && children.length) {
      res = res.concat(treeToFlat(children))
    }
  })
  return res
}

function deepCopy(obj, map = new WeakMap()) {
  if (typeof obj !== 'object' || obj === null) {
    return obj
  }

  if (map.has(obj)) {
    return map.get(obj)
  }

  const copy = Array.isArray(obj)
    ? []
    : Object.create(Object.getPrototypeOf(obj))

  map.set(obj, copy)

  Reflect.ownKeys(obj).forEach(key => {
    copy[key] = deepCopy(obj[key], map)
  })

  return copy
}

function transformTime() {
  const now = new Date();
  const year = now.getFullYear();
  // 补零：月份 0-11 → +1后转字符串，不足两位前面补0
  const month = String(now.getMonth() + 1).padStart(2, '0');

  console.log('原始日期：', dateStr); // 输出：2026-05-19

  // ✅ 修正正则：去掉多余的 $，匹配 yyyy-mm-dd
  const reg = /^(\d{4})-(\d{1,2})-(\d{1,2})$/;

  // ✅ 关键：接收 replace 返回的新字符串
  const time = dateStr.replace(reg, (...args) => {

    console.log('args', args);
    let [, $1, $2, $3] = args;
    // 补零逻辑
    $2 = $2.padStart(2, '0');
    $3 = $3.padStart(2, '0');
    return $1 + '年' + $2 + '月' + $3 + '日';
  });

  // ✅ 打印转换后的结果
  console.log('转换后：', time); 
}

// 任务队列类
class TaskQueue {
  constructor() {
    this.queue = []; // 存放任务
  }

  // 添加任务
  addTask(fn, delay) {
    this.queue.push({ fn, delay });
    return this; // 链式调用
  }

  // 开始执行队列
  run() {
    // 没有任务直接结束
    if (!this.queue.length) return;

    let time = 0; // 累计计时

    this.queue.forEach(task => {
      console.log('task ------> ', task)
      time += task.delay; // 叠加延迟时间
      setTimeout(() => {
        task.fn();
      }, time * 1000);
    });
  }
}

// 触发后延迟执行，期间再次触发重置计时，停止触发 n 秒后才执行
function debounce(fn, delay) {
  let timer = null;
  return function (...args) {
    // 每次触发清空定时器
    if (timer) clearTimeout(timer);
    // 重新计时
    timer = setTimeout(() => {
      fn.apply(this, args);
      timer = null;
    }, delay);
  };
}
// 规定时间内只执行一次，多次触发也按固定频率执行
function throttle(fn, delay) {
  let prevTime = 0;
  return function (...args) {
    const now = Date.now();
    if (now - prevTime >= delay) {
      fn.apply(this, args);
      prevTime = now;
    }
  };
}
function throttle2(fn, delay) {
  let timer = null;
  return function (...args) {
    if (timer) return;
    timer = setTimeout(() => {
      fn.apply(this, args);
      timer = null;
    }, delay);
  };
}

function reverseArr(arr) {
  let left = 0
  let right = arr.length - 1
  while(left < right) {
    // 交换
    [arr[left], arr[right]] = [arr[right], arr[left]]
    left++
    right--
  }
  return arr
}

const myPromiseAll = (promises) => {
  return new Promise((resolve, reject) => {
    const results = [];
    let completedCount = 0;

    // 空数组直接返回
    if (promises.length === 0) {
      return resolve([]);
    }

    promises.forEach((promise, index) => {
      Promise.resolve(promise).then(value => {
        results[index] = value;
        completedCount++;
        
        if (completedCount === promises.length) {
          resolve(results);
        }
      }).catch(reject);
    });
  });
};

const myAllSettled = (promises) => {
  return new Promise((resolve) => {
    const res = [];
    let count = 0;
    const len = promises.length;

    if (len === 0) return resolve([]);

    promises.forEach((item, idx) => {
      // 统一转为Promise
      Promise.resolve(item)
        .then((val) => {
          res[idx] = { status: "fulfilled", value: val };
        })
        .catch((err) => {
          res[idx] = { status: "rejected", reason: err };
        })
        .finally(() => {
          count++;
          if (count === len) {
            resolve(res);
          }
        });
    });
  });
};

function numberToChinese(num) {
  // 转为字符串并去掉前面多余的0
  let str = String(num).replace(/^0+/, '');
  // 输入全是0直接返回零
  if (!str) return '零';

  // 数字对应中文
  const digit = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  // 从右往左依次：个、十、百、千、万、十、百、千、亿...
  const unit = ['', '十', '百', '千', '万', '十', '百', '千', '亿', '十', '百', '千'];

  let result = '';
  // 标记前面是否出现过0
  let hasZero = false;

  // 从最后一位往前遍历（低位到高位）
  for (let i = 0; i < str.length; i++) {

    console.log('i', i,str,str.length - 1 - i);
    // 取出当前位数字
    let curNum = Number(str[str.length - 1 - i]);

    console.log('curNum', curNum);
    // 取出当前位单位
    let curUnit = unit[i];
    console.log('curUnit', curUnit);

    if (curNum === 0) {
      // 是0就打标记，暂时不拼接
      hasZero = true;
    } else {
      // 前面有0，先补一个零
      if (hasZero) {
        result = '零' + result;
        hasZero = false;
      }
      // 拼接 数字汉字 + 单位
      result = digit[curNum] + curUnit + result;
      console.log('result',curNum,  digit[curNum],curUnit,result);
    }
  }
  // 处理 一十 → 十 这种口语简写
  result = result.replace(/^一十/, '十');
  return result;
}
